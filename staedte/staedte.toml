# Staedteseiten unter /stadt/<slug> (Konrad, November 2026): die 23 groessten Staedte, alle
# Landeshauptstaedte und 15 Studentenstaedte, zusammen 42. deploy/bin/build_staedte.py baut aus
# jedem Eintrag mit `fertig = true` eine Seite; Zahlen in staedte/<slug>.json, Text in
# staedte/<slug>.md. Gemeindeschluessel und Wikidata stammen aus der OSM-Grenzrelation.
#
# Reihenfolge des Baus: Duesseldorf, Heidelberg, Berlin, dann der Rest.

[[stadt]]
slug = "duesseldorf"
name = "Düsseldorf"
# Ruhrgebiet und Rheinland: Beschriftungen in einer Spalte rechts daneben (x = 140, alle 22), mit Strich
beschriftung = { dx = 70, dy = 58, strich = true }
land = "Nordrhein-Westfalen"
land_iso = "DE-NW"
osm_relation = 62539
wikidata = "Q1718"
ags = "05111000"
fertig = true

[[stadt]]
slug = "heidelberg"
name = "Heidelberg"
# Unten rechts: rechts auf gleicher Hoehe liegt Nuernberg
beschriftung = { dx = 8, dy = 24 }
land = "Baden-Württemberg"
land_iso = "DE-BW"
osm_relation = 62487
wikidata = "Q2966"
ags = "08221000"
fertig = true

[[stadt]]
slug = "berlin"
name = "Berlin"
# Ueber dem Punkt: rechts liefe sie auf dem Handy ueber den Kartenrand
beschriftung = "oben"
land = "Berlin"
land_iso = "DE-BE"
osm_relation = 62422
wikidata = "Q64"
ags = "11000000"
fertig = true

