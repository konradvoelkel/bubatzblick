[project]
name = "bubatzblick"
version = "2.0.0"
description = "BubatzBlick (Bubatzkarte 2.0) — konservative Verbotszonen-Berechnung fuer ganz Deutschland (KCanG § 5)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "shapely>=2.0.6",
    "osmium>=3.7.0",
    "geopandas>=1.0.0",
    "pyarrow>=17.0.0",
    "joblib>=1.4.0",
    "pydantic-settings>=2.5.0",
    "pyproj>=3.6.0",
    "numpy>=2.1.0",
]


[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "hypothesis>=6.112.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pandas-stubs>=2.2.0",
    "types-shapely>=2.0.0",
    "types-geopandas>=1.0.0",
    "maturin>=1.15.0",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bubatzblick"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PTH", "C4", "PIE", "PERF"]
# Mathematische Symbole (⋃, ⊆, ...) in den Beweis-Docstrings sind Absicht.
allowed-confusables = ["⋃", "⋂", "−", "–"]

[tool.ruff.lint.per-file-ignores]
# HTML-Vorlagen in Strings: Zeilenlaenge dort ist Absicht.
"deploy/bin/build_stats.py" = ["E501"]


[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Keine Stubs/py.typed verfuegbar -- projektweit einmal deklariert statt
# als verstreute `# type: ignore[import-untyped]` an jeder Importstelle.
module = [
    "pyarrow",
    "pyarrow.*",
    "joblib",
    "joblib.*",
    "osmium",
    "osmium.*",
    "bubatzcore",
    "markdown",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: sampling_ref.py gegen echte, dicht bebaute Objekte (Laufzeit skaliert mit Hindernis-Kantenzahl) -- per Default an, ausschliessbar per `pytest -m 'not slow'`",
]
