# Fussgaengerzonen (Paragraf 5 Abs. 2 Nr. 5 KCanG), die eine Stadt amtlich nennt, die
# OpenStreetMap aber (noch) nicht als highway=pedestrian fuehrt. Handgepflegt.
# scripts/fussgaengerzonen.py holt die genannten Strassen aus OSM (Overpass) und schreibt
# nur die Abschnitte, die dort NICHT schon Fussgaengerzone sind, nach
# config/fussgaengerzonen.geojsonl; `bubatz pedestrian --extra-geojson` haengt sie an die
# Ebene aus OSM an (dieselben Kacheln, dasselbe Blau, 7 bis 20 Uhr).
#
# Aufgenommen wird nur, was eine amtliche Quelle als Fussgaengerzone nennt: Satzung,
# Verordnung, Strassen- oder Reinigungsverzeichnis mit eigener Spalte, Widmung oder
# Teileinziehung, amtlicher Stadtplan mit eingefaerbter Fussgaengerzone. Nicht: Presse
# allein, verkehrsberuhigte Bereiche (Zeichen 325), Wohnverkehrsstrassen,
# Gebuehrenzonen ohne das Wort Fussgaengerzone. Wo OSM mehr als die Quelle zeigt,
# bleibt das hier unberuehrt (die Datei ergaenzt nur).
#
# Schoener waere es, die Abschnitte in OSM einzutragen; dann faellt der Eintrag hier beim
# naechsten Lauf von selbst weg. Bis dahin steht die Quelle im Popup.
#
# Je Quelle:
#   id, ort, name     name: wie die Quelle die Zone nennt, steht im Popup
#   beleg             was die Quelle sagt (kurz), steht im Popup
#   quelle            URL der Quelle (https)
#   bbox              [sued, west, nord, ost] fuer die Overpass-Abfrage
#   [[zone.teil]]     wie in sonderzonen.toml: name = Regex auf OSM-name, ids = [..],
#                     lon_min/lon_max/lat_min/lat_max (Mittelpunkt des Wegs),
#                     ausschnitt = [sued, west, nord, ost] (Weg darauf zuschneiden),
#                     ohne_ids = [..], optional = true

