[package]
name = "bubatz"
description = "bubatzblick ohne Python: extract | clip | zones | tiles | report | update-pbf | verify | serve"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bubatz"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
bubatzcore = { path = "../bubatzcore" }
i_overlay = "9.0"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
arrow = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd", "lz4"] }
blake2 = "0.11"
rayon = "1"
osmpbf = "0.3"
ureq = { version = "2", default-features = false, features = ["tls"] }
flate2 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "signal", "macros"] }
pmtiles = { version = "0.24", default-features = false, features = ["mmap-async-tokio"] }
tower-http = { version = "0.7", default-features = false, features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1"
pmtiles = { version = "0.24", default-features = false, features = ["mmap-async-tokio", "write"] }
tower = { version = "0.5", features = ["util"] }
