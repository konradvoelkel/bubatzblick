# Staedteseiten unter /stadt/<slug> (Konrad, November 2026): die 23 groessten Staedte, alle
# Landeshauptstaedte und 15 Studentenstaedte, zusammen 42. deploy/bin/build_staedte.py baut aus
# jedem Eintrag mit `fertig = true` eine Seite; Zahlen in staedte/<slug>.json, Text in
# staedte/<slug>.md. Gemeindeschluessel und Wikidata stammen aus der OSM-Grenzrelation.
#
# Reihenfolge des Baus: Duesseldorf, Heidelberg, Berlin, dann der Rest.
# Auf der Karte der Uebersicht: `beschriftung` ("rechts", "links", "oben", "unten" oder
# { dx, dy, anker, strich }), `kurzname` statt des Namens, `name_handy = false` blendet den
# Namen auf dem Handy aus (dichte Gegenden).
# `recherche`: Datum der letzten Recherche zu Regeln und Quellen der Seite (von Hand nachziehen);
# die Zahlen tragen ihren eigenen Stand aus staedte/<slug>.json. `sonderzone`: Anker des Abschnitts
# zur eigenen Verbotszone der Stadt (config/sonderzonen.toml), fuer Querverweise.

