[package]
name = "bubatzcore-py"
description = "PyO3-Bindung des Geometriekerns; Python-Modul `bubatzcore`"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Der Bibliotheks-Crate heisst ebenfalls `bubatzcore`; ein zweites Ziel gleichen
# Namens im Workspace kollidiert bei den Ausgabedateien. Das Python-Modul heisst
# trotzdem `bubatzcore` (maturin `module-name` + `#[pyo3(name = ...)]`).
[lib]
name = "bubatzcore_py"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
bubatzcore = { path = "../bubatzcore" }
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
