# Staedteseiten unter /stadt/<slug> (Konrad, November 2026): die 23 groessten Staedte, alle
# Landeshauptstaedte und 15 Studentenstaedte, zusammen 42. deploy/bin/build_staedte.py baut aus
# jedem Eintrag mit `fertig = true` eine Seite; Zahlen in staedte/<slug>.json, Text in
# staedte/<slug>.md. Gemeindeschluessel und Wikidata stammen aus der OSM-Grenzrelation.
#
# Reihenfolge des Baus: Duesseldorf, Heidelberg, Berlin, dann der Rest.

[[stadt]]
slug = "duesseldorf"
